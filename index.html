<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0e">
    <title>Channel OS — sistema operacional para canais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ---------- Legacy studio styles (mantidos para Image/Video/Tools studios pré-existentes) ---------- */
        .modal-backdrop {
            background-color: rgba(10, 10, 14, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-fade { animation: fadeIn 300ms ease-out forwards; }
        @keyframes creation-fade-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        .animate-creation { animation: creation-fade-in 500ms ease-out forwards; }

        .studio-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; height: 100%; }
        @media (min-width: 1024px) { .studio-grid { grid-template-columns: repeat(3, 1fr); } }
        .controls-panel { background-color: rgb(22 22 30); padding: 1.5rem; border-radius: 14px; display: flex; flex-direction: column; gap: 1.5rem; overflow-y: auto; border: 1px solid rgb(40 40 56); perspective: 1000px; }
        @media (min-width: 1024px) { .controls-panel { grid-column: span 1 / span 1; } }
        .display-panel-container { background-color: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        @media (min-width: 1024px) { .display-panel-container { grid-column: span 2 / span 2; } }
        .section-title { font-size: 1.125rem; font-weight: 700; border-bottom: 1px solid rgb(40 40 56); padding-bottom: 0.75rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
        .section-title .icon { width: 1.25rem; height: 1.25rem; color: rgb(168 85 247); }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .button-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        .form-button { padding: 0.75rem; border-radius: 10px; font-weight: 600; transition: all 200ms ease-in-out; border: none; cursor: pointer; font-size: 0.875rem; background-color: rgb(30 30 40); color: rgba(255, 255, 255, 0.7); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .form-button:hover { background-color: rgb(40 40 52); }
        .form-button.active { background-color: rgb(168 85 247); color: rgb(245 245 250); box-shadow: 0 2px 15px rgba(168, 85, 247, 0.3); }
        .preset-card { width: 100%; text-align: left; padding: 0.75rem; border-radius: 14px; border: 2px solid transparent; background-color: rgb(30 30 40); transition: all 400ms ease-in-out; cursor: pointer; }
        .preset-card:hover { transform: translateZ(20px) rotateX(5deg); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); border-color: rgb(40 40 56); }
        .preset-card.active { background-color: rgba(168, 85, 247, 0.2); border-color: rgb(168 85 247); }
        .form-textarea { width: 100%; padding: 0.75rem; border-radius: 10px; border: 1px solid rgb(40 40 56); background-color: rgb(30 30 40); color: rgb(245 245 250); resize: vertical; transition: all 200ms ease-in-out; }
        .form-textarea:focus { outline: none; border-color: rgb(168 85 247); box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.5); }
        .action-button { width: 100%; background-color: rgb(56 248 167); color: rgb(10 10 14); font-weight: 700; padding: 0.875rem 1rem; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 200ms ease-in-out, transform 100ms ease-out; border: none; cursor: pointer; text-transform: uppercase; }
        .action-button:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 4px 20px rgba(56, 248, 167, 0.3); }
        .action-button:active:not(:disabled) { transform: scale(0.98); filter: brightness(1.2); }
        .action-button:disabled { background-color: rgb(30 30 40); color: rgba(255, 255, 255, 0.5); cursor: not-allowed; opacity: 0.6; }
        .secondary-action-button { width: 100%; background-color: rgb(30 30 40); color: rgb(245 245 250); font-weight: 700; padding: 0.5rem 1rem; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 200ms ease-in-out; border: 1px solid rgb(40 40 56); cursor: pointer; }
        .secondary-action-button:hover { background-color: rgb(40 40 52); }
        .shot-card { transition: all 300ms ease-in-out; }
        .shot-card:hover { border-color: rgb(168 85 247); box-shadow: 0 5px 25px rgba(168, 85, 247, 0.1); }
        .frame-slot { background-color: rgba(0,0,0,0.3); border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgb(40 40 56); }
        .frame-slot-label { position: absolute; top: 4px; left: 6px; font-size: 10px; font-weight: bold; color: rgb(245 245 250); background-color: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 6px; z-index: 10; }
        .frame-slot .spinner { width: 2rem; height: 2rem; border-width: 2px; border-style: dashed; border-radius: 9999px; animation: spin 1s linear infinite; border-color: rgb(168 85 247); }
        .frame-slot img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
